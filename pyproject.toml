[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.33", "uv-dynamic-versioning>=0.14.1"]

[project]
name = "waveorder"
description = "Wave-optical simulations and deconvolution of optical properties"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "CZ Biohub SF", email = "compmicro@czbiohub.org" }]
maintainers = [
  { name = "Talon Chandler", email = "talon.chandler@czbiohub.org" },
  { name = "Shalin Mehta", email = "shalin.mehta@czbiohub.org" },
]
keywords = [
  "simulation",
  "optics",
  "phase",
  "scattering",
  "polarization",
  "label-free",
  "permittivity",
  "reconstruction-algorithm",
  "qlipp",
  "mipolscope",
  "permittivity-tensor-imaging",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Typing :: Typed",
]
dependencies = [
    "iohub>=0.4.1,<0.5",
    "jsonargparse[signatures]>=4.53",
    # pinned: resume, the validation sums and the CLI rely on 2.6.6's restart and logging behaviour
    "lightning==2.6.6",
    "numpy>=2.5.4",
    "pyarrow>=26",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "tensordict>=0.15.6",
    "timm>=1.0.31",
    "torch>=2.15",
    "typer>=0.29.1,<0.30",
    "zarr>=3.4.2",
]
dynamic = ["version"]

[project.scripts]
waveorder = "waveorder.cli:app"
wo = "waveorder.cli:app"

[project.optional-dependencies]
wandb = ["wandb>=0.31"]
export = ["onnx>=1.23.2", "onnxruntime>=1.31.1", "onnxscript>=0.7.2"]

[dependency-groups]
test = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "wandb>=0.31",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
]
lint = ["ruff==0.17.4", "ty==0.0.101"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[project.urls]
Homepage = "https://github.com/Biohub/waveorder"
Repository = "https://github.com/Biohub/waveorder"
Issues = "https://github.com/Biohub/waveorder/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/waveorder"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"
pattern = "(?P<base>\\d+\\.\\d+\\.\\d+)"

[tool.uv]
default-groups = ["dev"]
# The lock fails if a dependency stops shipping a wheel for one of these. PyPI's Linux torch wheels are built against
# CUDA 13 (torch 2.15: CUDA 13.2 through cuda-toolkit); its macOS arm64 wheels run on the CPU and MPS.
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# --- ruff ------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]  # the 3.x documentation, left as it is until it is rewritten

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
  "E",       # pycodestyle errors, including E501 at line-length
  "W",       # pycodestyle warnings
  "F",       # pyflakes
  "I",       # import order
  "B",       # bugbear: mutable defaults, loop closures, call defaults
  "UP",      # modern syntax for target-version
  "SIM",     # simplifications
  "PIE",     # unnecessary code
  "RUF",     # ruff-specific
  "NPY",     # numpy legacy APIs
  "PERF",    # avoidable loops and copies
  "RET",     # return consistency
  "A",       # builtin shadowing
  "ARG",     # unused arguments
  "ANN",     # annotations on every signature
  "D",       # docstrings, numpy convention
  "FBT",     # boolean flags are keyword-only
  "C90",     # cyclomatic complexity
  "PLR09",   # argument, branch, statement, return counts
  "PLR0917", # positional argument count (preview)
  "UP046",   # PEP 695 generic classes (preview)
  "UP047",   # PEP 695 generic functions (preview)
  "SLF",     # no access to another object's private members
  "TID",     # banned imports and lazy optional dependencies
  "T20",     # no print; use logging
  "BLE",     # no blind except
  "ERA",     # no commented-out code
  "N",       # pep8 naming
  "PT",      # pytest style
]
ignore = [
  "N803", # math notation: argument names such as H, NA
  "N806", # math notation: local names such as H, S_k
  "D105", # magic methods document themselves
  "D107", # __init__ is documented on the class
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PLR2004", "PLR0913", "PLR0917"]  # parametrized tests take one argument per case field
"tests/io/__init__.py" = ["A005"]  # the tests of waveorder.io, not a module named io
# the classes a Lightning configuration names subclass Lightning's; nothing imports these modules up front
"src/waveorder/train/lightning.py" = ["TID253"]
"src/waveorder/models/_lightning.py" = ["TID253"]
"benchmarks/**" = ["TID251"]  # benchmarks compare against reference arrays in numpy; the numpy ban is for waveorder
"tests/benchmarks/**" = ["TID251"]
"benchmarks/train/multinode/*.py" = ["T201"]  # scripts of a Slurm job: what they report goes to the job's log

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-positional-args = 3

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
banned-module-level-imports = [
  "wandb",
  "nsight",
  "matplotlib",
  "napari",
  "tensorboard",
  "torch.utils.tensorboard",
  "lightning",
  "pytorch_lightning",
  "timm",
  "onnx",
  "onnxruntime",
  "onnxscript",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "annotations are evaluated eagerly in waveorder; pydantic and torch read them at runtime"
"numpy".msg = "waveorder is torch-only: numpy breaks vmap, torch.compile and autograd"

# --- ty --------------------------------------------------------------------

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
unused-ignore-comment = "error"
redundant-cast = "error"
# torch declares `nn.Module.forward: Callable[..., Any]` as a mutable attribute, so every `def forward` override
# trips this rule; there is no other mutable-attribute override in the package to protect.
incompatible-mutable-override = "ignore"

# --- pytest ----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests/benchmarks import the repository's benchmarks/ suite, which is not installed
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
