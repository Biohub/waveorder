version: 4
data:
  input_channel_names:
  - GFP
  time_indices: all
  pixel_size:
    yx: 0.2
    z: 0.4
imaging_system:
  contrast: fluorescence
  field_dependence: shift_invariant
  index_of_refraction_media: 1.3
  detection:
    wavelength: 0.532
    numerical_aperture: 1.2
    pinhole: none
    pupil_aberrations:
      astigmatism_0:
        nominal: 0.0
        tolerance: free
    z_focus_offset: 0.0
  illumination:
    tilt:
      zenith: 0.0
      azimuth: 0.0
    invert_phase_contrast: false
object:
  dimension: 3
  prior:
    beads:
      diameter: 0.5
      snr_threshold: 6.0
      max_beads: 50
      min_separation: 5
  weight: 0.001
  constraints: []
noise:
  gaussian:
    sigma: 1.0
solver:
  padding:
    z: 0
    yx: 0
  reconstruction: closed_form
  calibration:
    score: evidence
    search:
    - gradient:
        max_iter: 150
        method: split
    final_estimate: best_H
  apodization_rolloff: 0.0
outputs:
- reconstruction
- transfer_function
