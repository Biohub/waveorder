data:
  input_channel_names:
  - GFP
  pixel_size:
    yx: 0.2
    z: 0.4
imaging_system:
  contrast: fluorescence
  detection:
    numerical_aperture: 1.2
    pupil_aberrations:
      astigmatism_0:
        nominal: 0.0
        tolerance: free
    wavelength: 0.532
  index_of_refraction_media: 1.3
noise:
  gaussian:
    sigma: 1.0
object:
  prior:
    beads:
      diameter: 0.5
solver:
  calibration:
    score: evidence
    search:
    - gradient:
        max_iter: 150
version: 4
