data:
  input_channel_names:
  - GFP
  pixel_size:
    yx: 0.2
    z: 0.4
  time_indices: all
imaging_system:
  contrast: fluorescence
  detection:
    numerical_aperture: 1.2
    pinhole: none
    pupil_aberrations:
      astigmatism_0:
        bounds: null
        nominal: 0.0
        tolerance: free
      zernike_up_to_order: null
    wavelength: 0.532
    z_focus_offset: 0.0
  field_dependence: shift_invariant
  illumination:
    invert_phase_contrast: false
    numerical_aperture: null
    tilt:
      azimuth: 0.0
      zenith: 0.0
    wavelength: null
  index_of_refraction_media: 1.3
noise:
  gaussian:
    sigma: 1.0
    snr_db: null
  poisson: null
  poisson_gaussian: null
object:
  constraints: []
  dimension: 3
  prior:
    beads:
      diameter: 0.5
      max_beads: 50
      min_separation: 5
      snr_threshold: 6.0
  source: null
  weight: 0.001
outputs:
- reconstruction
- transfer_function
simulate: null
solver:
  apodization_rolloff: 0.0
  calibration:
    advanced: null
    final_estimate: best_H
    score: evidence
    search:
    - gradient:
        max_iter: 150
        method: split
  device: null
  padding:
    yx: 0
    z: 0
  reconstruction: closed_form
version: 4
