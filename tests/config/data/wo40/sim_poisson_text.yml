version: 4
data:
  input_channel_names:
  - GFP
  time_indices: all
  pixel_size:
    yx: 0.2
    z: 0.4
imaging_system:
  contrast: fluorescence
  field_dependence: shift_invariant
  index_of_refraction_media: 1.3
  detection:
    wavelength: 0.532
    numerical_aperture: 1.2
    pinhole: none
    pupil_aberrations:
      astigmatism_0:
        nominal: 0.0
        tolerance: 0.1
      spherical: 0.08
    z_focus_offset: 0.0
  illumination:
    tilt:
      zenith: 0.0
      azimuth: 0.0
    invert_phase_contrast: false
object:
  dimension: 3
  prior: tikhonov
  weight: 0.001
  constraints: []
  source:
    gaussian_spectrum:
      exponent: 2.0
noise:
  poisson:
    gain: 1.0
    offset: 0.0
    photons: 50.0
solver:
  padding:
    z: 0
    yx: 0
  reconstruction: closed_form
  apodization_rolloff: 0.0
outputs:
- reconstruction
- transfer_function
simulate:
  seed: 0
  shape:
  - 16
  - 32
  - 32
