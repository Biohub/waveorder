# Made from phase_3d.yml (waveorder 3.x, 4ea8027:docs/examples/cli/configs/phase_3d.yml) with its commented
# auto_regularization block filled in, which becomes object.weight: {auto: ...} in waveorder 4.
input_channel_names:
- Brightfield
time_indices: all
reconstruction_dimension: 3
phase:
  transfer_function:
    wavelength_illumination: 0.532
    yx_pixel_size: 0.1
    z_pixel_size: 0.25
    z_padding: 0
    z_focus_offset: 0
    index_of_refraction_media: 1.3
    numerical_aperture_detection: 1.2
    tilt_angle_zenith: 0.0
    tilt_angle_azimuth: 0.0
    numerical_aperture_illumination: 0.9
    invert_phase_contrast: false
  apply_inverse:
    reconstruction_algorithm: Tikhonov
    regularization_strength: 0.001
    TV_rho_strength: 0.001
    TV_iterations: 1
    apodization_rolloff: 0.0
    auto_regularization:
      rule: otsu_cnr
      search_min: -6.0
      search_max: 2.0
      num_samples: 25
      search_scale: relative
      report_path: null
      plot_path: null
